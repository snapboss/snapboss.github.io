<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxured Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <script>
        /* ============================================================
           Monet-style dynamic color engine
           Derives a full Material 3 tonal palette from a seed color
           (simulating Android's wallpaper-based "Monet" theming).
           ============================================================ */
        (function () {
            'use strict';
            var SEEDS = ['#6750A4', '#0061A4', '#00696D', '#8C5000', '#7D5260', '#386A20'];
            var PAL_KEY = 'm3_seed', THEME_KEY = 'm3_dark';

            function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
            function hsl(h, s, l, a) {
                h = ((h % 360) + 360) % 360;
                return 'hsl(' + h.toFixed(1) + ', ' + clamp(s, 0, 100).toFixed(1) + '%, ' +
                    clamp(l, 0, 100).toFixed(1) + '%' + (a === undefined ? '' : ' / ' + a) + ')';
            }
            function seedToHsl(hex) {
                var m = hex.replace('#', '');
                var r = parseInt(m.substr(0, 2), 16) / 255,
                    g = parseInt(m.substr(2, 2), 16) / 255,
                    b = parseInt(m.substr(4, 2), 16) / 255;
                var max = Math.max(r, g, b), min = Math.min(r, g, b);
                var d = max - min, h = 0, l = (max + min) / 2;
                var s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
                if (d !== 0) {
                    if (max === r) h = 60 * (((g - b) / d) % 6);
                    else if (max === g) h = 60 * ((b - r) / d + 2);
                    else h = 60 * ((r - g) / d + 4);
                }
                if (h < 0) h += 360;
                return { h: h, s: s * 100 };
            }
            function scheme(seed, dark) {
                var c = seedToHsl(seed), h = c.h, s = c.s;
                var pc = clamp(s * 0.9, 14, 48), sc = clamp(s * 0.32, 8, 22), tc = clamp(s * 0.6, 18, 40);
                var nc = clamp(s * 0.09, 3, 8), nvc = clamp(s * 0.22, 5, 14);
                var th = h + 60, eh = 12, ec = 55;
                var v = {};
                if (!dark) {
                    v['--primary'] = hsl(h, pc, 42);            v['--on-primary'] = hsl(h, pc, 100);
                    v['--primary-container'] = hsl(h, pc, 90);  v['--on-primary-container'] = hsl(h, pc, 16);
                    v['--secondary-container'] = hsl(h, sc, 88);v['--on-secondary-container'] = hsl(h, sc, 20);
                    v['--tertiary'] = hsl(th, tc, 42);
                    v['--tertiary-container'] = hsl(th, tc, 90);v['--on-tertiary-container'] = hsl(th, tc, 16);
                    v['--surface'] = hsl(h, nc, 98);            v['--surface-container-lowest'] = hsl(h, nc, 100);
                    v['--surface-container-low'] = hsl(h, nc, 96); v['--surface-container'] = hsl(h, nc, 94);
                    v['--surface-container-high'] = hsl(h, nc, 91); v['--surface-container-highest'] = hsl(h, nc, 88);
                    v['--on-surface'] = hsl(h, nc, 12);         v['--on-surface-variant'] = hsl(h, nvc, 34);
                    v['--outline'] = hsl(h, nvc, 52);           v['--outline-variant'] = hsl(h, nvc, 82);
                    v['--inverse-surface'] = hsl(h, nc, 20);    v['--inverse-on-surface'] = hsl(h, nc, 95);
                    v['--error'] = hsl(eh, ec, 45);             v['--on-error'] = hsl(eh, ec, 100);
                    v['--error-container'] = hsl(eh, ec, 90);   v['--on-error-container'] = hsl(eh, ec, 16);
                } else {
                    v['--primary'] = hsl(h, pc, 80);            v['--on-primary'] = hsl(h, pc, 20);
                    v['--primary-container'] = hsl(h, pc, 31);  v['--on-primary-container'] = hsl(h, pc, 90);
                    v['--secondary-container'] = hsl(h, sc, 31);v['--on-secondary-container'] = hsl(h, sc, 90);
                    v['--tertiary'] = hsl(th, tc, 80);
                    v['--tertiary-container'] = hsl(th, tc, 31);v['--on-tertiary-container'] = hsl(th, tc, 90);
                    v['--surface'] = hsl(h, nc, 7);             v['--surface-container-lowest'] = hsl(h, nc, 4);
                    v['--surface-container-low'] = hsl(h, nc, 10); v['--surface-container'] = hsl(h, nc, 13);
                    v['--surface-container-high'] = hsl(h, nc, 17); v['--surface-container-highest'] = hsl(h, nc, 22);
                    v['--on-surface'] = hsl(h, nc, 91);         v['--on-surface-variant'] = hsl(h, nvc, 80);
                    v['--outline'] = hsl(h, nvc, 62);           v['--outline-variant'] = hsl(h, nvc, 30);
                    v['--inverse-surface'] = hsl(h, nc, 91);    v['--inverse-on-surface'] = hsl(h, nc, 20);
                    v['--error'] = hsl(eh, ec, 80);             v['--on-error'] = hsl(eh, ec, 20);
                    v['--error-container'] = hsl(eh, ec, 30);   v['--on-error-container'] = hsl(eh, ec, 90);
                }
                v['--scrim'] = hsl(h, nc, dark ? 4 : 10, 0.55);
                return v;
            }
            var storedDark = null;
            try { storedDark = localStorage.getItem(THEME_KEY); } catch (e) {}
            var state = {
                seed: (function () { try { return localStorage.getItem(PAL_KEY) || SEEDS[0]; } catch (e) { return SEEDS[0]; } })(),
                dark: storedDark === null
                    ? window.matchMedia('(prefers-color-scheme: dark)').matches
                    : storedDark === '1'
            };
            function apply() {
                var v = scheme(state.seed, state.dark);
                var root = document.documentElement;
                for (var k in v) root.style.setProperty(k, v[k]);
                root.setAttribute('data-theme', state.dark ? 'dark' : 'light');
            }
            apply();
            window.M3Palette = {
                seeds: SEEDS,
                get seed() { return state.seed; },
                get dark() { return state.dark; },
                apply: apply,
                cycle: function () {
                    var i = SEEDS.indexOf(state.seed);
                    state.seed = SEEDS[(i + 1) % SEEDS.length];
                    try { localStorage.setItem(PAL_KEY, state.seed); } catch (e) {}
                    apply();
                },
                toggleTheme: function () {
                    state.dark = !state.dark;
                    try { localStorage.setItem(THEME_KEY, state.dark ? '1' : '0'); } catch (e) {}
                    apply();
                    return state.dark;
                }
            };
        })();
    </script>
    <style>
        /* Baseline M3 fallback colors (overridden by the Monet engine above) */
        :root {
            --primary: #6750A4; --on-primary: #FFFFFF;
            --primary-container: #EADDFF; --on-primary-container: #21005D;
            --secondary-container: #E8DEF8; --on-secondary-container: #1D192B;
            --tertiary: #7D5260; --tertiary-container: #FFD8E4; --on-tertiary-container: #31111D;
            --surface: #FEF7FF; --surface-container-lowest: #FFFFFF;
            --surface-container-low: #F7F2FA; --surface-container: #F3EDF7;
            --surface-container-high: #ECE6F0; --surface-container-highest: #E6E0E9;
            --on-surface: #1D1B20; --on-surface-variant: #49454F;
            --outline: #79747E; --outline-variant: #CAC4D0;
            --error: #B3261E; --on-error: #FFFFFF; --error-container: #F9DEDC; --on-error-container: #410E0B;
            --inverse-surface: #322F35; --inverse-on-surface: #F5EFF7;
            --scrim: rgba(0, 0, 0, 0.45);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-emphasized: cubic-bezier(0.2, 0, 0, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Roboto Flex', 'Roboto', system-ui, sans-serif;
            font-optical-sizing: auto;
            background: var(--surface);
            color: var(--on-surface);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .display {
            font-variation-settings: 'wdth' 120, 'opsz' 144;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .ms {
            font-family: 'Material Symbols Rounded';
            font-weight: normal; font-style: normal;
            font-size: 24px; line-height: 1;
            letter-spacing: normal; text-transform: none;
            display: inline-block; white-space: nowrap; word-wrap: normal;
            direction: ltr; -webkit-font-smoothing: antialiased;
            font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
            user-select: none;
        }

        /* ---------------- Splash screen ---------------- */
        #splash-screen {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 10000;
            background: var(--surface);
            overflow: hidden;
            transition: opacity 0.5s ease-out, visibility 0.5s;
        }
        #splash-screen.hidden { opacity: 0; pointer-events: none; visibility: hidden; }

        .blob {
            position: absolute; width: 55vmax; height: 55vmax;
            border-radius: 50%; filter: blur(90px); opacity: 0.6;
            animation: drift 18s ease-in-out infinite alternate;
        }
        .blob-1 { background: var(--primary-container); top: -15%; left: -10%; }
        .blob-2 { background: var(--tertiary-container); bottom: -20%; right: -10%; animation-delay: -6s; }
        .blob-3 { background: var(--secondary-container); top: 28%; left: 52%; width: 34vmax; height: 34vmax; animation-delay: -12s; }
        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(6%, 8%) scale(1.15); }
        }

        .splash-brand {
            position: relative;
            font-size: clamp(2rem, 6vw, 3.2rem);
            color: var(--on-surface);
            margin-bottom: 2.5rem;
            text-align: center;
            z-index: 1;
        }

        .dragon-ball-container {
            position: relative; z-index: 1;
            cursor: pointer;
            animation: float 3.5s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .dragon-ball {
            width: 210px; height: 210px;
            border-radius: 50%;
            background: radial-gradient(circle at 32% 28%,
                var(--primary-container) 0%,
                var(--primary) 62%,
                color-mix(in srgb, var(--primary) 68%, #000) 100%);
            box-shadow:
                0 24px 60px color-mix(in srgb, var(--primary) 38%, transparent),
                inset -18px -18px 44px rgba(0, 0, 0, 0.22),
                inset 14px 14px 34px rgba(255, 255, 255, 0.28);
            position: relative;
            overflow: hidden;
            transition: transform 0.35s var(--ease-spring);
        }
        .dragon-ball:hover { transform: scale(1.08); }

        .star {
            position: absolute; inset: 0;
            display: grid; place-items: center;
        }
        .star .ms {
            font-size: 96px;
            color: var(--on-primary);
            text-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
            animation: pulse-star 2.4s ease-in-out infinite;
        }
        @keyframes pulse-star {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(0.92); }
        }

        .tap-btn {
            position: relative; z-index: 1;
            margin-top: 3rem;
            font-family: inherit;
            font-size: 0.95rem; font-weight: 700;
            letter-spacing: 0.22em; text-transform: uppercase;
            padding: 18px 44px;
            border: none; border-radius: 100px;
            background: var(--primary); color: var(--on-primary);
            cursor: pointer;
            box-shadow: 0 10px 30px color-mix(in srgb, var(--primary) 42%, transparent);
            animation: breathe 2.6s ease-in-out infinite;
            transition: background-color 0.4s ease, transform 0.3s var(--ease-spring);
        }
        .tap-btn:hover { transform: scale(1.05); }
        .tap-btn:active { transform: scale(0.96); }
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* ---------------- Main content ---------------- */
        #main-content { display: none; min-height: 100vh; }
        #main-content.visible { display: block; animation: fadeUp 0.6s var(--ease-emphasized); }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: none; }
        }

        .app-bar {
            position: sticky; top: 0; z-index: 900;
            display: flex; align-items: center; gap: 14px;
            padding: 12px 24px;
            background: color-mix(in srgb, var(--surface-container) 82%, transparent);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--outline-variant);
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }
        .app-logo {
            width: 46px; height: 46px; flex-shrink: 0;
            border-radius: 16px 26px 16px 26px;
            display: grid; place-items: center;
            background: var(--primary); color: var(--on-primary);
        }
        .app-logo .ms { font-size: 26px; }
        .app-title { font-size: 1.3rem; font-weight: 700; letter-spacing: 0.08em; line-height: 1.1; }
        .app-subtitle {
            font-size: 0.68rem; font-weight: 600;
            color: var(--on-surface-variant);
            letter-spacing: 0.16em; text-transform: uppercase;
            margin-top: 2px;
        }
        .app-actions { margin-left: auto; display: flex; gap: 6px; }

        .icon-btn {
            width: 46px; height: 46px;
            border: none; border-radius: 50%;
            background: transparent; color: var(--on-surface-variant);
            display: grid; place-items: center;
            cursor: pointer;
            position: relative; overflow: hidden;
            transition: background-color 0.25s ease, color 0.25s ease, transform 0.3s var(--ease-spring);
        }
        .icon-btn:hover { background: var(--surface-container-highest); color: var(--on-surface); transform: scale(1.06); }
        .icon-btn:active { transform: scale(0.94); }
        .close-btn {
            position: absolute; top: 20px; right: 20px;
            background: var(--secondary-container) !important;
            color: var(--on-secondary-container) !important;
        }

        .hero { padding: 4rem 2rem 2.5rem; text-align: center; }
        .hero h1 {
            font-size: clamp(3rem, 9vw, 5.8rem);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background: linear-gradient(100deg, var(--primary) 10%, var(--tertiary) 90%);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; color: transparent;
        }
        .hero-chip {
            display: inline-flex; align-items: center; gap: 10px;
            margin-top: 1.4rem;
            padding: 12px 22px;
            border-radius: 100px;
            background: var(--secondary-container);
            color: var(--on-secondary-container);
            font-size: 0.82rem; font-weight: 700;
            letter-spacing: 0.2em; text-transform: uppercase;
            transition: background-color 0.4s ease;
        }
        .hero-chip .ms { font-size: 18px; }

        .container { max-width: 1400px; margin: 0 auto; padding: 1rem 2rem 4rem; }

        .loading {
            display: flex; flex-direction: column; align-items: center; gap: 20px;
            padding: 4rem 1rem;
            color: var(--on-surface-variant);
            font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
            font-size: 0.82rem;
        }
        .spinner {
            width: 46px; height: 46px; border-radius: 50%;
            border: 4px solid color-mix(in srgb, var(--primary) 18%, transparent);
            border-top-color: var(--primary);
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        /* ---------------- Project cards ---------------- */
        .project-card {
            background: var(--surface-container-low);
            border: 1px solid var(--outline-variant);
            border-radius: 28px;
            padding: 26px;
            cursor: pointer;
            position: relative; overflow: hidden;
            transition:
                transform 0.35s var(--ease-spring),
                box-shadow 0.35s var(--ease-emphasized),
                background-color 0.3s ease,
                border-color 0.3s ease;
        }
        .project-card:hover {
            transform: translateY(-8px) scale(1.015);
            box-shadow: 0 22px 44px -12px rgba(0, 0, 0, 0.28);
            background: var(--surface-container-highest);
            border-color: color-mix(in srgb, var(--primary) 45%, var(--outline-variant));
        }
        .project-card:active { transform: translateY(-2px) scale(0.99); }

        .card-head { display: flex; align-items: center; gap: 15px; margin-bottom: 14px; }
        .card-icon {
            width: 54px; height: 54px; flex-shrink: 0;
            display: grid; place-items: center;
            background: var(--secondary-container);
            color: var(--on-secondary-container);
        }
        .card-icon .ms { font-size: 27px; }
        /* M3 Expressive: playful varied shapes */
        .project-card:nth-child(4n+1) .card-icon { border-radius: 50%; }
        .project-card:nth-child(4n+2) .card-icon { border-radius: 18px; }
        .project-card:nth-child(4n+3) .card-icon { border-radius: 30px 10px 30px 10px; }
        .project-card:nth-child(4n+4) .card-icon { border-radius: 10px 30px 10px 30px; }

        .project-card h3 {
            font-size: 1.4rem; font-weight: 700;
            line-height: 1.15; color: var(--on-surface);
            font-variation-settings: 'wdth' 115;
            word-break: break-word;
        }
        .project-card p {
            color: var(--on-surface-variant);
            font-size: 0.92rem; line-height: 1.65;
            margin-bottom: 18px;
        }

        .project-meta { display: flex; gap: 8px; flex-wrap: wrap; }
        .chip {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 7px 14px;
            border-radius: 100px;
            border: 1px solid var(--outline-variant);
            color: var(--on-surface-variant);
            font-size: 0.74rem; font-weight: 600; letter-spacing: 0.02em;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .chip .ms { font-size: 15px; }

        /* ---------------- Modal ---------------- */
        .modal {
            display: none;
            position: fixed; inset: 0;
            background: var(--scrim);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
            overflow-y: auto;
        }
        .modal.active {
            display: flex; align-items: center; justify-content: center;
            padding: 2rem;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-content {
            background: var(--surface-container-high);
            border-radius: 32px;
            padding: 32px;
            max-width: 900px; width: 100%;
            max-height: 90vh; overflow-y: auto;
            position: relative;
            animation: popIn 0.45s var(--ease-spring);
            box-shadow: 0 32px 64px -16px rgba(0, 0, 0, 0.4);
            transition: background-color 0.4s ease;
        }
        @keyframes popIn {
            from { transform: scale(0.88) translateY(28px); opacity: 0; }
            to { transform: none; opacity: 1; }
        }

        .modal-header { padding-right: 56px; }
        .modal-header h2 {
            font-size: 2.1rem; font-weight: 700;
            font-variation-settings: 'wdth' 118;
            color: var(--on-surface);
            line-height: 1.15;
            word-break: break-word;
        }
        .modal-header .modal-chip {
            display: inline-flex; align-items: center; gap: 6px;
            margin-top: 10px;
            padding: 6px 14px; border-radius: 100px;
            background: var(--primary-container);
            color: var(--on-primary-container);
            font-size: 0.74rem; font-weight: 700; letter-spacing: 0.06em;
        }
        .modal-header .modal-chip .ms { font-size: 15px; }

        .file-browser { margin-top: 1.8rem; display: flex; flex-direction: column; gap: 10px; }

        .list-item {
            display: flex; align-items: center; gap: 16px;
            padding: 14px 18px;
            border-radius: 20px;
            background: var(--surface-container);
            cursor: pointer;
            position: relative; overflow: hidden;
            transition:
                background-color 0.25s ease,
                transform 0.3s var(--ease-spring),
                box-shadow 0.3s ease;
        }
        .list-item:hover {
            background: var(--surface-container-highest);
            transform: translateX(6px);
        }
        .list-item:active { transform: scale(0.985); }

        .icon-box {
            width: 46px; height: 46px; flex-shrink: 0;
            border-radius: 16px;
            display: grid; place-items: center;
            background: var(--secondary-container);
            color: var(--on-secondary-container);
        }
        .list-item.primary .icon-box {
            background: var(--primary); color: var(--on-primary); border-radius: 50%;
        }
        .list-item.tertiary .icon-box {
            background: var(--tertiary-container); color: var(--on-tertiary-container);
            border-radius: 23px 9px 23px 9px;
        }

        .icon { font-size: 1.5rem; flex-shrink: 0; }
        .file-name { flex: 1; font-weight: 600; color: var(--on-surface); font-size: 0.98rem; }
        .file-sub {
            font-size: 0.82rem; color: var(--on-surface-variant);
            margin-top: 4px; line-height: 1.5;
        }
        .item-body { flex: 1; min-width: 0; }
        .chev { color: var(--on-surface-variant); font-size: 22px; }
        .date-chip {
            flex-shrink: 0;
            padding: 6px 12px; border-radius: 100px;
            background: var(--surface-container-highest);
            color: var(--on-surface-variant);
            font-size: 0.74rem; font-weight: 600;
            white-space: nowrap;
        }

        .rss-title {
            color: var(--primary);
            font-size: 1.35rem; font-weight: 700;
            margin: 1.8rem 0 0.9rem;
            font-variation-settings: 'wdth' 118;
            display: flex; align-items: center; gap: 10px;
        }
        .rss-title .ms { font-size: 22px; }

        .info-box {
            margin-top: 1.8rem;
            padding: 20px 22px;
            display: flex; gap: 15px; align-items: flex-start;
            border-radius: 24px;
            background: var(--tertiary-container);
            color: var(--on-tertiary-container);
            transition: background-color 0.4s ease;
        }
        .info-box .ms { flex-shrink: 0; font-size: 24px; margin-top: 1px; }
        .info-box strong { display: block; font-size: 0.95rem; margin-bottom: 5px; }
        .info-box span { font-size: 0.88rem; line-height: 1.6; opacity: 0.92; }

        .error-box {
            margin-top: 1.8rem;
            padding: 20px 22px;
            border-radius: 24px;
            background: var(--error-container);
            color: var(--on-error-container);
        }
        .error-box strong { display: block; margin-bottom: 5px; font-size: 0.95rem; }
        .error-box span { font-size: 0.88rem; line-height: 1.6; opacity: 0.92; }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 1rem;
            color: var(--on-surface-variant);
        }
        .empty-icon {
            width: 112px; height: 112px;
            margin: 0 auto 1.4rem;
            border-radius: 38% 62% 55% 45% / 50% 42% 58% 50%;
            display: grid; place-items: center;
            background: var(--surface-container-high);
            color: var(--on-surface-variant);
        }
        .empty-icon .ms { font-size: 52px; }
        .empty-state h3 { color: var(--on-surface); font-size: 1.3rem; margin-bottom: 0.5rem; }
        .empty-state p { font-size: 0.92rem; }

        /* ---------------- Ripple (M3 state layer) ---------------- */
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            background: currentColor;
            opacity: 0.14;
            pointer-events: none;
            animation: ripple 0.6s linear;
        }
        @keyframes ripple { to { transform: scale(2.6); opacity: 0; } }

        @media (max-width: 768px) {
            .app-bar { padding: 10px 16px; }
            .hero { padding: 2.5rem 1.2rem 1.8rem; }
            .container { padding: 1rem 1.2rem 3rem; }
            .projects-grid { grid-template-columns: 1fr; }
            .modal.active { padding: 1rem; align-items: flex-end; }
            .modal-content { padding: 24px 20px; border-radius: 28px; max-height: 92vh; }
            .dragon-ball { width: 170px; height: 170px; }
            .star .ms { font-size: 78px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001s !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001s !important;
            }
        }
    </style>
</head>
<body>
    <div id="splash-screen">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="splash-brand display">Luxured Archive</div>
        <div class="dragon-ball-container" onclick="enterSite()">
            <div class="dragon-ball ripple-target">
                <div class="star"><span class="ms">star</span></div>
            </div>
        </div>
        <button class="tap-btn ripple-target" onclick="enterSite()">Tap to enter</button>
    </div>

    <div id="main-content">
        <header class="app-bar">
            <div class="app-logo"><span class="ms">star</span></div>
            <div>
                <div class="app-title display">LUXURED</div>
                <div class="app-subtitle">SourceForge Project Archive</div>
            </div>
            <div class="app-actions">
                <button class="icon-btn ripple-target" onclick="cyclePalette()" aria-label="Change accent color" title="Change accent color">
                    <span class="ms" id="palette-icon">palette</span>
                </button>
                <button class="icon-btn ripple-target" onclick="toggleTheme()" aria-label="Toggle light or dark theme" title="Toggle light/dark theme">
                    <span class="ms" id="theme-icon">dark_mode</span>
                </button>
            </div>
        </header>

        <section class="hero">
            <h1 class="display">LUXURED</h1>
            <div class="hero-chip"><span class="ms">inventory_2</span> SourceForge Project Archive</div>
        </section>

        <main class="container">
            <div id="loading" class="loading" style="display: flex;">
                <div class="spinner"></div>
                Loading projects from SourceForge…
            </div>
            <div id="projects" class="projects-grid"></div>
        </main>

        <div id="modal" class="modal">
            <div class="modal-content">
                <button class="icon-btn close-btn ripple-target" onclick="closeModal()" aria-label="Close dialog">
                    <span class="ms">close</span>
                </button>
                <div class="modal-header">
                    <h2 id="modal-title"></h2>
                    <div class="modal-chip"><span class="ms">deployed_code</span> <span id="modal-project-name"></span></div>
                </div>
                <div id="modal-body"></div>
            </div>
        </div>
    </div>

    <script>
        let audioPlayed = false;

        function enterSite() {
            const splash = document.getElementById('splash-screen');
            const mainContent = document.getElementById('main-content');

            if (!audioPlayed) {
                const audio = new Audio('https://www.myinstants.com/media/sounds/fahhh_KcgAXfs.mp3');
                audio.play().catch(err => console.log('Audio play failed:', err));
                audioPlayed = true;
            }

            setTimeout(() => {
                splash.classList.add('hidden');
                mainContent.classList.add('visible');
                setTimeout(() => {
                    splash.style.display = 'none';
                }, 500);
            }, 300);
        }

        /* ---------- Material 3 theme controls (Monet dynamic color) ---------- */
        function syncThemeIcon() {
            const icon = document.getElementById('theme-icon');
            if (icon) icon.textContent = M3Palette.dark ? 'light_mode' : 'dark_mode';
        }

        function toggleTheme() {
            M3Palette.toggleTheme();
            syncThemeIcon();
        }

        function cyclePalette() {
            M3Palette.cycle();
            const icon = document.getElementById('palette-icon');
            if (icon && icon.animate) {
                icon.animate(
                    [{ transform: 'rotate(0deg) scale(1)' }, { transform: 'rotate(360deg) scale(1.25)' }, { transform: 'rotate(360deg) scale(1)' }],
                    { duration: 550, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)' }
                );
            }
        }

        /* ---------- M3 ripple state layers (event delegation) ---------- */
        document.addEventListener('pointerdown', function (e) {
            const target = e.target.closest('.ripple-target');
            if (!target) return;
            const rect = target.getBoundingClientRect();
            const d = Math.max(rect.width, rect.height) * 1.2;
            const span = document.createElement('span');
            span.className = 'ripple';
            span.style.width = span.style.height = d + 'px';
            span.style.left = (e.clientX - rect.left - d / 2) + 'px';
            span.style.top = (e.clientY - rect.top - d / 2) + 'px';
            target.appendChild(span);
            span.addEventListener('animationend', () => span.remove());
        });

        /* ---------- SourceForge project archive (original logic) ---------- */
        const USERNAME = 'tenxherepakapak';
        let projects = [];
        const CARD_ICONS = ['deployed_code', 'terminal', 'code_blocks', 'science', 'extension', 'memory'];

        async function loadProjects() {
            const loadingEl = document.getElementById('loading');
            loadingEl.style.display = 'flex';

            try {
                const response = await fetch(`https://sourceforge.net/rest/u/${USERNAME}/profile`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.projects && data.projects.length > 0) {
                        projects = data.projects.map(p => ({
                            name: extractProjectName(p.url),
                            title: p.name,
                            summary: p.summary || 'SourceForge project',
                            lastUpdated: p.last_updated
                        }));
                        loadingEl.style.display = 'none';
                        displayProjects();
                        return;
                    }
                }
            } catch (error) {
                console.error('Error fetching from API:', error);
            }

            const stored = localStorage.getItem('sourceforge_projects');
            if (stored) {
                projects = JSON.parse(stored);
                loadingEl.style.display = 'none';
                displayProjects();
            } else {
                loadingEl.style.display = 'none';
                displayEmptyState();
            }
        }

        function extractProjectName(url) {
            const match = url.match(/\/p\/([^\/]+)/);
            return match ? match[1] : url;
        }

        function saveProjects() {
            localStorage.setItem('sourceforge_projects', JSON.stringify(projects));
        }

        function formatDate(value) {
            if (!value) return '';
            const d = new Date(value);
            return isNaN(d) ? '' : d.toLocaleDateString();
        }

        function displayProjects() {
            const container = document.getElementById('projects');

            if (projects.length === 0) {
                displayEmptyState();
                return;
            }

            container.innerHTML = projects.map((project, index) => {
                const date = formatDate(project.lastUpdated) || formatDate(project.addedDate);
                return `
                <div class="project-card ripple-target" onclick="openProject('${project.name}', '${escapeHtml(project.title)}')">
                    <div class="card-head">
                        <div class="card-icon"><span class="ms">${CARD_ICONS[index % CARD_ICONS.length]}</span></div>
                        <h3 class="display">${escapeHtml(project.title)}</h3>
                    </div>
                    <p>${escapeHtml(project.summary)}</p>
                    <div class="project-meta">
                        <span class="chip"><span class="ms">deployed_code</span> ${project.name}</span>
                        ${date ? `<span class="chip"><span class="ms">schedule</span> ${date}</span>` : ''}
                    </div>
                </div>
            `;}).join('');
        }

        function displayEmptyState() {
            const container = document.getElementById('projects');
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon"><span class="ms">folder_open</span></div>
                    <h3 class="display">No projects found</h3>
                    <p>User "${USERNAME}" has no public projects on SourceForge.</p>
                </div>
            `;
        }

        function openProject(projectName, projectTitle) {
            document.getElementById('modal-title').textContent = projectTitle;
            document.getElementById('modal-project-name').textContent = projectName;
            document.getElementById('modal').classList.add('active');

            const modalBody = document.getElementById('modal-body');
            modalBody.innerHTML = `
                <div class="file-browser">
                    <div class="list-item ripple-target" onclick="window.open('https://sourceforge.net/projects/${projectName}/files/', '_blank')">
                        <div class="icon-box"><span class="ms">folder</span></div>
                        <span class="file-name">Browse All Files &amp; Folders</span>
                        <span class="ms chev">chevron_right</span>
                    </div>
                    <div class="list-item primary ripple-target" onclick="window.open('https://sourceforge.net/projects/${projectName}/files/latest/download', '_blank')">
                        <div class="icon-box"><span class="ms">download</span></div>
                        <span class="file-name">Download Latest Release</span>
                        <span class="ms chev">chevron_right</span>
                    </div>
                    <div class="list-item tertiary ripple-target" onclick="loadRSSFiles('${projectName}')">
                        <div class="icon-box"><span class="ms">rss_feed</span></div>
                        <span class="file-name">View Recent Files</span>
                        <span class="ms chev">chevron_right</span>
                    </div>
                </div>
                <div id="rss-content"></div>
                <div class="info-box">
                    <span class="ms">info</span>
                    <div>
                        <strong>File Access</strong>
                        <span>SourceForge download speed might be slow depending on your region. To fix this you can either change the download server on SourceForge or use a VPN.</span>
                    </div>
                </div>
            `;
        }

        async function loadRSSFiles(projectName) {
            const rssContent = document.getElementById('rss-content');
            rssContent.innerHTML = `
                <div class="loading" style="display: flex; padding: 2rem 1rem;">
                    <div class="spinner"></div>
                    Loading files…
                </div>
            `;

            try {
                const proxyUrl = 'https://api.allorigins.win/raw?url=';
                const rssUrl = `https://sourceforge.net/projects/${projectName}/rss`;
                const response = await fetch(proxyUrl + encodeURIComponent(rssUrl));

                if (!response.ok) throw new Error('Failed to fetch');

                const text = await response.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, 'text/xml');

                const items = xml.querySelectorAll('item');

                if (items.length === 0) {
                    rssContent.innerHTML = `
                        <div class="empty-state" style="grid-column: auto; padding: 2rem;">
                            <p>No recent files found</p>
                        </div>
                    `;
                    return;
                }

                let html = `
                    <h3 class="rss-title"><span class="ms">rss_feed</span> Recent Files &amp; Updates</h3>
                    <div class="file-browser">
                `;

                items.forEach((item, index) => {
                    if (index < 20) {
                        const title = item.querySelector('title')?.textContent || 'Unknown';
                        const link = item.querySelector('link')?.textContent || '';
                        const pubDate = item.querySelector('pubDate')?.textContent || '';
                        const description = item.querySelector('description')?.textContent || '';

                        const date = formatDate(pubDate);

                        html += `
                            <div class="list-item ripple-target" onclick="window.open('${escapeHtml(link)}', '_blank')">
                                <div class="icon-box"><span class="ms">description</span></div>
                                <div class="item-body">
                                    <div class="file-name">${escapeHtml(title)}</div>
                                    ${description ? `<div class="file-sub">${escapeHtml(description.substring(0, 100))}${description.length > 100 ? '…' : ''}</div>` : ''}
                                </div>
                                ${date ? `<span class="date-chip">${date}</span>` : ''}
                            </div>
                        `;
                    }
                });

                html += '</div>';
                rssContent.innerHTML = html;

            } catch (error) {
                console.error('Error loading files:', error);
                rssContent.innerHTML = `
                    <div class="error-box">
                        <strong>Unable to load files</strong>
                        <span>${error.message}</span>
                    </div>
                `;
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('modal').addEventListener('click', function (e) {
            if (e.target === this) {
                closeModal();
            }
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeModal();
        });

        syncThemeIcon();
        loadProjects();
    </script>
</body>
</html>
