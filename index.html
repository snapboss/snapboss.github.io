<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxured Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Staatliches&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #141b3d;
            --accent-cyan: #00ffcc;
            --accent-magenta: #ff006e;
            --accent-yellow: #ffbe0b;
            --text-primary: #e8f4f8;
            --text-secondary: #8892b0;
            --border-color: #1e2a5e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #ff6b00 0%, #ff8c00 50%, #ffa500 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 0.5s ease-out;
        }

        #splash-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .dragon-ball-container {
            position: relative;
            cursor: pointer;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .dragon-ball {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle at 30% 30%, #ffeb3b, #ff9800);
            border-radius: 50%;
            position: relative;
            box-shadow: 
                0 0 40px rgba(255, 152, 0, 0.8),
                inset -20px -20px 40px rgba(0, 0, 0, 0.2),
                inset 20px 20px 40px rgba(255, 255, 255, 0.3);
            transition: transform 0.3s ease;
        }

        .dragon-ball:hover {
            transform: scale(1.1);
        }

        .dragon-ball::before {
            content: '';
            position: absolute;
            top: 20%;
            left: 20%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.4) 0%, transparent 70%);
            border-radius: 50%;
        }

        .star {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
        }

        .star::before {
            content: '★';
            font-size: 80px;
            color: #d32f2f;
            text-shadow: 
                2px 2px 4px rgba(0, 0, 0, 0.5),
                0 0 20px rgba(211, 47, 47, 0.6);
            display: block;
            animation: pulse-star 2s ease-in-out infinite;
        }

        @keyframes pulse-star {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(0.95); }
        }

        .splash-text {
            margin-top: 3rem;
            font-family: 'Staatliches', cursive;
            font-size: 2.5rem;
            color: white;
            text-shadow: 
                3px 3px 6px rgba(0, 0, 0, 0.5),
                0 0 30px rgba(255, 152, 0, 0.8);
            animation: glow-text 2s ease-in-out infinite;
            letter-spacing: 0.2em;
        }

        @keyframes glow-text {
            0%, 100% { text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 152, 0, 0.8); }
            50% { text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5), 0 0 50px rgba(255, 152, 0, 1); }
        }

        #main-content {
            display: none;
            min-height: 100vh;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 255, 204, 0.03) 2px, rgba(0, 255, 204, 0.03) 4px),
                radial-gradient(circle at 20% 50%, rgba(255, 0, 110, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 255, 204, 0.1) 0%, transparent 50%);
        }

        #main-content.visible {
            display: block;
        }

        .header {
            padding: 3rem 2rem;
            text-align: center;
            border-bottom: 3px solid var(--border-color);
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(0, 255, 204, 0.02) 10px,
                rgba(0, 255, 204, 0.02) 20px
            );
            animation: slide 20s linear infinite;
        }

        @keyframes slide {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .header h1 {
            font-family: 'Staatliches', cursive;
            font-size: 4rem;
            letter-spacing: 0.1em;
            background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-magenta) 50%, var(--accent-yellow) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            position: relative;
            animation: glow 3s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(0, 255, 204, 0.5)); }
            50% { filter: drop-shadow(0 0 40px rgba(255, 0, 110, 0.7)); }
        }

        .header p {
            font-size: 1rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.3em;
            position: relative;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .loading {
            text-align: center;
            padding: 4rem 2rem;
            font-size: 1.2rem;
            color: var(--accent-cyan);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .project-card {
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 204, 0.1), transparent);
            transition: left 0.5s;
        }

        .project-card:hover::before {
            left: 100%;
        }

        .project-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-cyan);
            box-shadow: 0 20px 40px rgba(0, 255, 204, 0.2);
        }

        .project-card h3 {
            font-family: 'Staatliches', cursive;
            font-size: 1.8rem;
            color: var(--accent-cyan);
            margin-bottom: 1rem;
            letter-spacing: 0.05em;
        }

        .project-card p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .project-meta {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .meta-item {
            padding: 0.25rem 0.75rem;
            background: rgba(0, 255, 204, 0.1);
            border-radius: 4px;
            border: 1px solid rgba(0, 255, 204, 0.3);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 14, 39, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            overflow-y: auto;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 3px solid var(--accent-cyan);
            border-radius: 16px;
            padding: 3rem;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 30px 60px rgba(0, 255, 204, 0.3);
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .close-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: var(--accent-magenta);
            border: none;
            color: white;
            font-size: 1.5rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-family: 'JetBrains Mono', monospace;
        }

        .close-btn:hover {
            transform: rotate(90deg);
            background: var(--accent-yellow);
        }

        .modal-header h2 {
            font-family: 'Staatliches', cursive;
            font-size: 2.5rem;
            color: var(--accent-cyan);
            margin-bottom: 1rem;
            letter-spacing: 0.05em;
        }

        .file-browser {
            margin-top: 2rem;
        }

        .file-item, .folder-item {
            padding: 1rem;
            margin: 0.5rem 0;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .file-item:hover, .folder-item:hover {
            border-color: var(--accent-cyan);
            transform: translateX(8px);
            background: rgba(0, 255, 204, 0.05);
        }

        .folder-item {
            border-left: 4px solid var(--accent-yellow);
        }

        .file-item {
            border-left: 4px solid var(--accent-magenta);
        }

        .icon {
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .file-name {
            flex: 1;
            font-weight: 700;
            color: var(--text-primary);
        }

        .info-box {
            margin-top: 2rem;
            padding: 1.5rem;
            background: rgba(255, 190, 11, 0.1);
            border: 1px solid rgba(255, 190, 11, 0.3);
            border-radius: 8px;
        }

        .info-box p {
            color: var(--accent-yellow);
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .info-box span {
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5rem;
            }

            .projects-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 2rem;
            }

            .input-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div id="splash-screen">
        <div class="dragon-ball-container" onclick="enterSite()">
            <div class="dragon-ball">
                <div class="star"></div>
            </div>
        </div>
        <div class="splash-text">TAP TO ENTER</div>
    </div>

    <div id="main-content">
    <div class="header">
        <h1>LUXURED</h1>
        <p>SourceForge Project Archive</p>
    </div>

    <div class="container">
        <div id="loading" class="loading" style="display: block;">
            ⚡ LOADING PROJECTS FROM SOURCEFORGE...
        </div>
        <div id="projects" class="projects-grid"></div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">×</button>
            <div class="modal-header">
                <h2 id="modal-title"></h2>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>
    </div>

    <script>
        let audioPlayed = false;

        function enterSite() {
            const splash = document.getElementById('splash-screen');
            const mainContent = document.getElementById('main-content');
            
            if (!audioPlayed) {
                const audio = new Audio('https://www.myinstants.com/media/sounds/fahhh_KcgAXfs.mp3');
                audio.play().catch(err => console.log('Audio play failed:', err));
                audioPlayed = true;
            }
            
            setTimeout(() => {
                splash.classList.add('hidden');
                mainContent.classList.add('visible');
                setTimeout(() => {
                    splash.style.display = 'none';
                }, 500);
            }, 300);
        }

        const USERNAME = 'tenxherepakapak';
        let projects = [];

        async function loadProjects() {
            const loadingEl = document.getElementById('loading');
            loadingEl.style.display = 'block';
            
            try {
                const response = await fetch(`https://sourceforge.net/rest/u/${USERNAME}/profile`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.projects && data.projects.length > 0) {
                        projects = data.projects.map(p => ({
                            name: extractProjectName(p.url),
                            title: p.name,
                            summary: p.summary || 'SourceForge project',
                            lastUpdated: p.last_updated
                        }));
                        loadingEl.style.display = 'none';
                        displayProjects();
                        return;
                    }
                }
            } catch (error) {
                console.error('Error fetching from API:', error);
            }
            
            const stored = localStorage.getItem('sourceforge_projects');
            if (stored) {
                projects = JSON.parse(stored);
                loadingEl.style.display = 'none';
                displayProjects();
            } else {
                loadingEl.style.display = 'none';
                displayEmptyState();
            }
        }
        
        function extractProjectName(url) {
            const match = url.match(/\/p\/([^\/]+)/);
            return match ? match[1] : url;
        }

        function saveProjects() {
            localStorage.setItem('sourceforge_projects', JSON.stringify(projects));
        }

        function displayProjects() {
            const container = document.getElementById('projects');

            if (projects.length === 0) {
                displayEmptyState();
                return;
            }

            container.innerHTML = projects.map(project => `
                <div class="project-card" onclick="openProject('${project.name}', '${escapeHtml(project.title)}')">
                    <h3>${escapeHtml(project.title)}</h3>
                    <p>${escapeHtml(project.summary)}</p>
                    <div class="project-meta">
                        <span class="meta-item">📦 ${project.name}</span>
                        ${project.lastUpdated ? `<span class="meta-item">🕐 ${new Date(project.lastUpdated).toLocaleDateString()}</span>` : 
                          project.addedDate ? `<span class="meta-item">🕐 ${new Date(project.addedDate).toLocaleDateString()}</span>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function displayEmptyState() {
            const container = document.getElementById('projects');
            container.innerHTML = `
                <div class="empty-state">
                    <div class="icon">📂</div>
                    <h3>No projects found</h3>
                    <p>User "${USERNAME}" has no public projects on SourceForge.</p>
                </div>
            `;
        }

        function openProject(projectName, projectTitle) {
            document.getElementById('modal-title').textContent = projectTitle;
            document.getElementById('modal').classList.add('active');
            
            const modalBody = document.getElementById('modal-body');
            modalBody.innerHTML = `
                <div class="file-browser">
                    <div class="folder-item" onclick="window.open('https://sourceforge.net/projects/${projectName}/files/', '_blank')">
                        <span class="icon">📁</span>
                        <span class="file-name">Browse All Files & Folders</span>
                    </div>
                    <div class="file-item" onclick="window.open('https://sourceforge.net/projects/${projectName}/files/latest/download', '_blank')">
                        <span class="icon">⬇️</span>
                        <span class="file-name">Download Latest Release</span>
                    </div>
                    <div class="file-item" onclick="loadRSSFiles('${projectName}')">
                        <span class="icon">📡</span>
                        <span class="file-name">View Recent Files</span>
                    </div>
                </div>
                <div id="rss-content"></div>
                <div class="info-box">
                    <p>ℹ️ File Access</p>
                    <span>SourceForge download speed might be slow depending on your region. To fix this you can either change the download server on SourceForge or use a VPN.</span>
                </div>
            `;
        }

        async function loadRSSFiles(projectName) {
            const rssContent = document.getElementById('rss-content');
            rssContent.innerHTML = '<div class="loading">⚡ LOADING FILES...</div>';
            
            try {
                const proxyUrl = 'https://api.allorigins.win/raw?url=';
                const rssUrl = `https://sourceforge.net/projects/${projectName}/rss`;
                const response = await fetch(proxyUrl + encodeURIComponent(rssUrl));
                
                if (!response.ok) throw new Error('Failed to fetch');
                
                const text = await response.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, 'text/xml');
                
                const items = xml.querySelectorAll('item');
                
                if (items.length === 0) {
                    rssContent.innerHTML = `
                        <div style="padding: 2rem; text-align: center; color: var(--text-secondary);">
                            <p>No recent files found</p>
                        </div>
                    `;
                    return;
                }
                
                let html = '<div style="margin-top: 2rem;"><h3 style="color: var(--accent-cyan); font-family: \'Staatliches\', cursive; font-size: 1.5rem; margin-bottom: 1rem;">Recent Files & Updates</h3><div class="file-browser">';
                
                items.forEach((item, index) => {
                    if (index < 20) {
                        const title = item.querySelector('title')?.textContent || 'Unknown';
                        const link = item.querySelector('link')?.textContent || '';
                        const pubDate = item.querySelector('pubDate')?.textContent || '';
                        const description = item.querySelector('description')?.textContent || '';
                        
                        const date = pubDate ? new Date(pubDate).toLocaleDateString() : '';
                        
                        html += `
                            <div class="file-item" onclick="window.open('${escapeHtml(link)}', '_blank')">
                                <span class="icon">📄</span>
                                <div style="flex: 1;">
                                    <div class="file-name">${escapeHtml(title)}</div>
                                    ${description ? `<div style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.25rem;">${escapeHtml(description.substring(0, 100))}${description.length > 100 ? '...' : ''}</div>` : ''}
                                </div>
                                ${date ? `<span class="file-size">${date}</span>` : ''}
                            </div>
                        `;
                    }
                });
                
                html += '</div></div>';
                rssContent.innerHTML = html;
                
            } catch (error) {
                console.error('Error loading files:', error);
                rssContent.innerHTML = `
                    <div style="padding: 2rem; background: rgba(255, 0, 110, 0.1); border: 2px solid var(--accent-magenta); border-radius: 8px; margin-top: 2rem;">
                        <p style="color: var(--accent-magenta); font-weight: 700;">⚠️ Unable to load files</p>
                        <p style="color: var(--text-secondary); margin-top: 0.5rem; font-size: 0.9rem;">${error.message}</p>
                    </div>
                `;
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        loadProjects();
    </script>
</body>
</html>
